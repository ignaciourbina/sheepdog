<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheepdog</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <header>
      <div class="header-left">
        <h1>Sheepdog</h1>
        <span class="subtitle" id="scan-status"></span>
      </div>
      <div class="header-right">
        <div class="search-wrapper">
          <span class="search-icon">&#x1F50D;</span>
          <input
            type="text"
            id="search-input"
            placeholder="Search packages..."
            autocomplete="off"
          />
          <span class="search-hint">/</span>
        </div>
        <button id="scan-btn" title="Scan for virtual environments">
          Scan
        </button>
        <button id="settings-btn" class="settings-btn" title="Settings">&#x2699;</button>
      </div>
    </header>

    <div id="stats-bar" class="stats-bar hidden"></div>
    <div id="filter-bar" class="filter-bar hidden"></div>
    <nav id="breadcrumb" class="breadcrumb hidden"></nav>

    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-section">
        <div class="settings-label">Theme</div>
        <div class="theme-options">
          <button class="theme-option" data-theme="dark">
            <span class="theme-swatch theme-swatch-dark"></span>
            Dark
          </button>
          <button class="theme-option" data-theme="light">
            <span class="theme-swatch theme-swatch-light"></span>
            Light
          </button>
          <button class="theme-option" data-theme="high-contrast">
            <span class="theme-swatch theme-swatch-hc"></span>
            High Contrast
          </button>
        </div>
      </div>
      <div class="settings-divider"></div>
      <div class="settings-section">
        <div class="settings-label">UI Font</div>
        <div class="settings-row">
          <select id="settings-ui-font" class="settings-select">
            <option value="default">System Default</option>
            <option value="inter">Inter</option>
            <option value="roboto">Roboto</option>
            <option value="helvetica">Helvetica</option>
            <option value="mono">Monospace</option>
          </select>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Code Font</div>
        <div class="settings-row">
          <select id="settings-code-font" class="settings-select">
            <option value="default">System Mono</option>
            <option value="jetbrains">JetBrains Mono</option>
            <option value="firacode">Fira Code</option>
            <option value="cascadia">Cascadia Code</option>
            <option value="ubuntu">Ubuntu Mono</option>
          </select>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Font Size</div>
        <div class="settings-row font-size-row">
          <button class="font-size-btn" id="font-size-down">-</button>
          <span class="font-size-display" id="font-size-display">13px</span>
          <button class="font-size-btn" id="font-size-up">+</button>
        </div>
      </div>
    </div>

    <div id="file-viewer-overlay" class="file-viewer-overlay hidden" onclick="if(event.target===this)closeFileViewer()">
      <div class="file-viewer">
        <div class="file-viewer-header">
          <div>
            <div class="file-viewer-title" id="file-viewer-title"></div>
            <div class="file-viewer-path" id="file-viewer-path"></div>
          </div>
          <button class="file-viewer-close" onclick="closeFileViewer()">&times;</button>
        </div>
        <pre class="file-viewer-body" id="file-viewer-body"></pre>
      </div>
    </div>

    <div id="context-menu" class="context-menu hidden">
      <button class="context-item" id="ctx-open-vscode">Open in VS Code</button>
      <button class="context-item" id="ctx-copy-path">Copy Project Path</button>
      <div class="context-divider"></div>
      <button class="context-item" id="ctx-select-compare">Select for Compare</button>
      <button class="context-item" id="ctx-compare-with">Compare with...</button>
      <div class="context-divider" id="ctx-divider-clear"></div>
      <button class="context-item" id="ctx-clear-compare">Clear Selection</button>
    </div>
    <div id="compare-badge" class="compare-badge hidden"></div>

    <main id="main-content">
      <div id="table-container"></div>

      <div id="progress-overlay" class="hidden">
        <div class="progress-box">
          <div class="progress-text" id="progress-text">Scanning...</div>
          <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <div class="progress-detail" id="progress-detail"></div>
        </div>
      </div>
    </main>
  </body>
</html>
