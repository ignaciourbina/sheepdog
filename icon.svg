<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2240"/>
      <stop offset="100%" stop-color="#141628"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Left ear (black/dark) -->
  <path d="M138 165 L118 80 L190 130 Z" fill="#2a2a2a"/>
  <!-- Right ear (black/dark) -->
  <path d="M374 165 L394 80 L322 130 Z" fill="#2a2a2a"/>
  <!-- Ear inners (pink tint) -->
  <path d="M145 155 L133 95 L185 135 Z" fill="#4a3a3a"/>
  <path d="M367 155 L379 95 L327 135 Z" fill="#4a3a3a"/>

  <!-- Head shape - black fur -->
  <ellipse cx="256" cy="230" rx="125" ry="115" fill="#2a2a2a"/>

  <!-- White face blaze - the distinctive collie stripe down the center -->
  <path d="M226 115 Q256 100 286 115 L290 180 Q292 210 285 240 L280 290 Q270 340 256 350 Q242 340 232 290 L227 240 Q220 210 222 180 Z" fill="#f0ece8"/>

  <!-- White muzzle area -->
  <ellipse cx="256" cy="300" rx="62" ry="48" fill="#f0ece8"/>

  <!-- White cheek patches -->
  <ellipse cx="200" cy="270" rx="30" ry="25" fill="#f0ece8" opacity="0.5"/>
  <ellipse cx="312" cy="270" rx="30" ry="25" fill="#f0ece8" opacity="0.5"/>

  <!-- Eyebrow tan markings (border collie tan points) -->
  <ellipse cx="200" cy="210" rx="18" ry="10" fill="#8B6914" opacity="0.6"/>
  <ellipse cx="312" cy="210" rx="18" ry="10" fill="#8B6914" opacity="0.6"/>

  <!-- Eyes - almond shaped -->
  <ellipse cx="205" cy="225" rx="16" ry="14" fill="#3a2518"/>
  <ellipse cx="307" cy="225" rx="16" ry="14" fill="#3a2518"/>
  <!-- Eye shine -->
  <circle cx="211" cy="220" r="5" fill="#fff" opacity="0.85"/>
  <circle cx="313" cy="220" r="5" fill="#fff" opacity="0.85"/>
  <!-- Iris color -->
  <ellipse cx="205" cy="226" rx="10" ry="9" fill="#5C3317"/>
  <circle cx="210" cy="221" r="4" fill="#fff" opacity="0.8"/>
  <ellipse cx="307" cy="226" rx="10" ry="9" fill="#5C3317"/>
  <circle cx="312" cy="221" r="4" fill="#fff" opacity="0.8"/>

  <!-- Nose -->
  <path d="M244 295 Q256 285 268 295 Q270 305 260 312 Q256 314 252 312 Q242 305 244 295 Z" fill="#1a1a1a"/>
  <!-- Nose shine -->
  <ellipse cx="253" cy="296" rx="5" ry="3" fill="#fff" opacity="0.12"/>

  <!-- Mouth line -->
  <path d="M256 312 L256 322" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M256 322 Q244 332 236 328" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M256 322 Q268 332 276 328" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Subtle fur texture lines on black parts -->
  <path d="M160 190 Q170 200 165 215" stroke="#3a3a3a" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M352 190 Q342 200 347 215" stroke="#3a3a3a" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Chest/collar area hint -->
  <path d="M190 340 Q220 365 256 370 Q292 365 322 340" stroke="#f0ece8" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- Small Python-colored collar tag -->
  <circle cx="256" cy="385" r="12" fill="#60a5fa" opacity="0.9"/>
  <circle cx="256" cy="385" r="7" fill="#fbbf24" opacity="0.9"/>

  <!-- Subtle "SD" on tag -->
</svg>
