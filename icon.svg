<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: rounded square -->
  <rect width="512" height="512" rx="96" fill="#1a1d2e"/>

  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2240"/>
      <stop offset="100%" stop-color="#141628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Dog head silhouette - stylized border collie -->
  <!-- Left ear -->
  <path d="M148 140 Q130 90 158 70 Q186 55 200 100 L192 155 Z" fill="url(#accent)" opacity="0.9"/>
  <!-- Right ear -->
  <path d="M364 140 Q382 90 354 70 Q326 55 312 100 L320 155 Z" fill="url(#accent)" opacity="0.9"/>

  <!-- Head shape -->
  <ellipse cx="256" cy="200" rx="108" ry="100" fill="url(#accent)"/>

  <!-- Face/muzzle - lighter area -->
  <ellipse cx="256" cy="225" rx="60" ry="55" fill="#e2e4ea"/>

  <!-- Forehead blaze (white stripe - characteristic of border collies) -->
  <path d="M240 120 Q256 105 272 120 L268 185 Q256 190 244 185 Z" fill="#e2e4ea"/>

  <!-- Eyes -->
  <circle cx="218" cy="190" r="14" fill="#1a1d2e"/>
  <circle cx="294" cy="190" r="14" fill="#1a1d2e"/>
  <!-- Eye highlights -->
  <circle cx="223" cy="186" r="5" fill="#fff" opacity="0.8"/>
  <circle cx="299" cy="186" r="5" fill="#fff" opacity="0.8"/>

  <!-- Nose -->
  <ellipse cx="256" cy="235" rx="16" ry="12" fill="#1a1d2e"/>
  <!-- Nose highlight -->
  <ellipse cx="253" cy="232" rx="5" ry="3" fill="#fff" opacity="0.15"/>

  <!-- Mouth -->
  <path d="M256 247 Q245 260 238 255" stroke="#1a1d2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M256 247 Q267 260 274 255" stroke="#1a1d2e" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Python-inspired element: two small interlinked circles below the dog -->
  <circle cx="232" cy="340" r="22" fill="none" stroke="#fbbf24" stroke-width="5" opacity="0.7"/>
  <circle cx="280" cy="340" r="22" fill="none" stroke="#34d399" stroke-width="5" opacity="0.7"/>

  <!-- Connecting lines suggesting "herding" / organizing -->
  <line x1="210" y1="340" x2="180" y2="370" stroke="#fbbf24" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="302" y1="340" x2="332" y2="370" stroke="#34d399" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="232" y1="362" x2="232" y2="395" stroke="#fbbf24" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <line x1="280" y1="362" x2="280" y2="395" stroke="#34d399" stroke-width="3" opacity="0.4" stroke-linecap="round"/>

  <!-- Small dots representing scattered venvs being herded -->
  <circle cx="175" cy="385" r="6" fill="#fbbf24" opacity="0.5"/>
  <circle cx="340" cy="380" r="6" fill="#34d399" opacity="0.5"/>
  <circle cx="230" cy="410" r="6" fill="#60a5fa" opacity="0.5"/>
  <circle cx="285" cy="408" r="6" fill="#a78bfa" opacity="0.5"/>
  <circle cx="256" cy="430" r="6" fill="#fbbf24" opacity="0.5"/>
</svg>
